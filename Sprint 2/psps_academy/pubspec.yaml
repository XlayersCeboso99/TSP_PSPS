name: psps
description: Aplicación educativa offline de Ingeniería de Software con diseño del Sprint 2.
publish_to: 'none'
version: 0.2.0+5

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: 1.0.9
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  flutter_local_notifications: 20.1.0
  flutter_timezone: 5.1.0
