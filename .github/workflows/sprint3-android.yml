name: Sprint 3 Android release APK

# Compila y publica el APK release de la app oficial del Sprint 3.
# IMPORTANTE: la firma release actual usa la clave debug de Gradle. En GitHub
# Actions esa clave la genera el runner y es DISTINTA de la clave debug de una
# maquina local. Por eso este APK NO sirve para actualizar (adb install -r) un
# telefono que ya tenga PSPS instalada con otra firma: Android rechaza la
# actualizacion si el certificado cambia.

on:
  push:
    branches:
      - develop
      - main
      - 'integracion/**'
      - 'release/**'
    tags:
      - 'v*'
    paths:
      - 'Sprint 3/psps_academy/**'
      - '.github/workflows/sprint3-android.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Sprint 3/psps_academy/**'
      - '.github/workflows/sprint3-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint3-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 'Sprint 3/psps_academy'

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (locked)
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Unit, widget and verification tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Inspect APK (version, SDK, certificate, SHA-256)
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT2="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p ci-artifacts

          "$AAPT2" dump badging "$APK" | grep -E "^package:|sdkVersion" \
            | tee ci-artifacts/aapt2-badging.txt
          "$APKSIGNER" verify --print-certs -v "$APK" \
            | tee ci-artifacts/apksigner-verify.txt
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")") \
            | tee ci-artifacts/SHA256SUMS.txt

          {
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "pubspec_version=$VERSION"
            echo "apk=build/app/outputs/flutter-apk/app-release.apk"
            echo "--- aapt2 dump badging (package/sdk) ---"
            cat ci-artifacts/aapt2-badging.txt
            echo "--- apksigner verify --print-certs ---"
            cat ci-artifacts/apksigner-verify.txt
          } | tee ci-artifacts/build-info.txt

          echo "::warning::APK firmado con la clave debug del runner de GitHub Actions. Es distinta de la clave debug de una maquina local; NO sirve para actualizar un telefono que ya tenga PSPS firmada con otra clave."
          echo "APK de CI: solo para inspeccion/artefacto, no para adb install -r sobre un telefono con otra firma."

      - uses: actions/upload-artifact@v4
        with:
          name: sprint3-android-apk-${{ steps.sha.outputs.short }}
          path: |
            Sprint 3/psps_academy/build/app/outputs/flutter-apk/app-release.apk
            Sprint 3/psps_academy/ci-artifacts/
          if-no-files-found: error
          retention-days: 14
